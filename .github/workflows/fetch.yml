name: Fetch car park availability

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs when busy)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests "psycopg[binary]"
      - run: python fetch.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
